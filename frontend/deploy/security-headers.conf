# Included by every location in nginx.conf.example. nginx drops server-level add_header lines
# in any location that has its own add_header, so these must be repeated, hence the include.
#
# Content-Security-Policy: scripts and styles only from this site, no inline script, no eval.
# connect-src lists the API: replace https://api.example.com with your API's exact origin.
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.example.com; manifest-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# HSTS-BEGIN
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# HSTS-END
