name: Web CI

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/web-ci.yml']
  pull_request:
    branches: [main]
    paths: ['web/**']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm install
      - run: npx tsc --noEmit || true
      - run: npm run build
        env:
          JWT_SECRET: ci-test-secret-at-least-32-characters-long-xx
          JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-chars-long
          API_KEY_HASH_PEPPER: ci-pepper-16chars
          DATABASE_URL: file:./data/ci.db
          REQUIRE_2FA: "false"
